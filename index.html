<h2>Kuis Malnutrisi Energi-Protein dan Obesitas pada Anak</h2>
<div id="app"></div>
</div>
<script>
const Q=[
{t:"C1-C2",s:"Obesitas pada anak secara konseptual didefinisikan sebagai...",o:["Ketidakseimbangan asupan dan keluaran energi sehingga kelebihan energi disimpan sebagai jaringan lemak","Kadar hemoglobin rendah akibat defisiensi besi","Gangguan penyerapan zat gizi di usus halus","Kekurangan protein akibat asupan yang tidak memadai","Peningkatan kadar hormon tiroid"],w:["Anemia defisiensi besi adalah masalah gizi yang berbeda, bukan definisi obesitas.","Gangguan penyerapan adalah penyebab malnutrisi, bukan definisi obesitas.","Kekurangan protein menjelaskan kwashiorkor atau gizi buruk, bukan obesitas.","Hormon tiroid berperan sebagai komorbid atau penyebab endogen, bukan definisi obesitas."],e:"Obesitas adalah ketidakseimbangan antara asupan energi dan keluaran energi (energy expenditure), sehingga kelebihan energi disimpan dalam bentuk jaringan lemak. Definisi ini tercantum dalam Rekomendasi IDAI 2014."},
{t:"C1-C2",s:"Rumus indeks massa tubuh (IMT) yang benar adalah...",o:["BB (kg) / TB (m)²","TB (m) / BB (kg)²","BB (kg) / TB (cm)","BB (kg) × TB (m)","LiLA (cm) / TB (m)"],w:["Pembilang dan penyebut tertukar, sehingga hasil tidak mencerminkan berat relatif terhadap tinggi.","Satuan tinggi dalam cm tidak sesuai rumus, dan rumus tidak dibalik.","Rumus ini tidak mengkuadratkan tinggi; hasilnya tidak sesuai kurva IMT WHO atau CDC.","Perkalian bukan rumus IMT; IMT adalah berat dibagi kuadrat tinggi."],e:"IMT = berat badan (kg) dibagi tinggi badan (m) kuadrat. Nilainya kemudian dibandingkan dengan kurva IMT/U WHO 2006 untuk usia di bawah 2 tahun atau CDC 2000 untuk usia 2-18 tahun."},
{t:"C1-C2",s:"Pada balita usia 6-59 bulan, salah satu kriteria gizi buruk adalah lingkar lengan atas (LiLA) kurang dari...",o:["11,5 cm","12,5 cm","13,5 cm","10 cm","14 cm"],w:["12,5 cm adalah batas kesembuhan (zona hijau), bukan batas diagnosis gizi buruk.","13,5 cm bukan batas diagnosis yang digunakan pada pedoman.","10 cm terlalu rendah; balita dengan LiLA di antara 10 dan 11,5 cm tetap termasuk gizi buruk.","14 cm berada di atas ambang gizi buruk sehingga tidak memenuhi kriteria."],e:"Balita 6-59 bulan dengan LiLA kurang dari 11,5 cm termasuk gizi buruk. Kriteria lain adalah BB/PB atau BB/TB kurang dari -3 SD, atau edema bilateral pitting. Pada tahap kesembuhan, LiLA minimal 12,5 cm."},
{t:"C1-C2",s:"Balita gizi buruk tanpa komplikasi dapat dirawat jalan. Kondisi berikut merupakan komplikasi yang mengharuskan rawat inap adalah...",o:["Letargi atau penurunan kesadaran","Edema bilateral derajat +1","LiLA 11,5 cm tanpa gejala lain","Nafsu makan baik dengan berat badan stabil","Tanpa penyakit penyerta"],w:["Edema derajat +1 termasuk gizi buruk tanpa komplikasi sehingga dapat dirawat jalan.","LiLA 11,5 cm adalah kriteria diagnosis, bukan komplikasi.","Nafsu makan baik adalah tanda prognosis baik, bukan komplikasi.","Tanpa penyakit penyerta justru memenuhi syarat rawat jalan."],e:"Komplikasi gizi buruk meliputi anoreksia, dehidrasi berat (muntah terus-menerus atau diare), letargi atau penurunan kesadaran, demam tinggi, pneumonia berat, dan anemia berat. Adanya minimal satu komplikasi mengharuskan rawat inap."},
{t:"C1-C2",s:"Kwashiorkor secara sederhana digambarkan sebagai defisiensi terutama...",o:["Protein","Energi total","Lemak","Vitamin A","Air"],w:["Defisiensi energi total yang mengenai semua makronutrien adalah gambaran marasmus.","Lemak bukan defisiensi utama pada kwashiorkor.","Defisiensi vitamin A dapat menyertai gizi buruk, tetapi bukan defisiensi utama kwashiorkor.","Air tidak termasuk defisiensi utama; dehidrasi adalah kondisi terpisah."],e:"Pedoman Kemenkes 2019 yang dikutip PPT menyatakan marasmus adalah defisiensi semua makronutrien, sedangkan kwashiorkor adalah defisiensi protein yang predominan. Pada kwashiorkor tampak edema, sedangkan marasmus tampak sangat kurus tanpa edema."},
{t:"C1-C2",s:"Kebutuhan energi balita gizi buruk tanpa komplikasi pada fase rawat jalan adalah...",o:["150-220 kkal/kgBB/hari","80-100 kkal/kgBB/hari","100-150 kkal/kgBB/hari","50-80 kkal/kgBB/hari","220-300 kkal/kgBB/hari"],w:["80-100 kkal/kgBB/hari adalah kebutuhan fase stabilisasi rawat inap.","100-150 kkal/kgBB/hari adalah kebutuhan fase transisi rawat inap.","50-80 kkal/kgBB/hari terlalu rendah dan tidak sesuai rekomendasi untuk pemulihan.","220-300 kkal/kgBB/hari melampaui kebutuhan rawat jalan yang dianjurkan."],e:"Pada rawat jalan balita gizi buruk tanpa komplikasi, kebutuhan energi 150-220 kkal/kgBB/hari, protein 4-6 g/kgBB/hari, dan cairan 150-200 ml/kgBB/hari. Kebutuhan ini sama dengan fase rehabilitasi rawat inap."},
{t:"C1-C2",s:"Pada rawat jalan, F-100 diberikan kepada balita gizi buruk setiap...",o:["4 jam (6 kali sehari)","2 jam (12 kali sehari)","8 jam (3 kali sehari)","1 jam sekali","12 jam sekali"],w:["2 jam sekali terlalu sering untuk petunjuk rawat jalan dan tidak sesuai dengan pedoman.","8 jam sekali hanya 3 kali sehari, kurang dari kebutuhan energi yang dianjurkan.","1 jam sekali tidak realistis untuk pemberian di rumah.","12 jam sekali terlalu jarang untuk memenuhi kebutuhan energi."],e:"F-100 adalah formula cair berisi 100 kkal per 100 ml. Pada rawat jalan diberikan per 4 jam, yaitu 6 kali sehari, sesuai petunjuk pemberian di layanan rawat jalan. Kunjungan ulang dilakukan seminggu sekali."},
{t:"C1-C2",s:"Target kenaikan berat badan minimal pada balita gizi buruk rawat jalan adalah...",o:["5 g/kgBB/hari atau 50 g/kgBB/minggu","1 g/kgBB/hari atau 10 g/kgBB/minggu","10 g/kgBB/hari atau 100 g/kgBB/minggu","2 g/kgBB/hari atau 20 g/kgBB/minggu","20 g/kgBB/hari atau 200 g/kgBB/minggu"],w:["1 g/kgBB/hari terlalu rendah dan menandakan respons yang belum memadai.","10 g/kgBB/hari adalah target fase rehabilitasi rawat inap, bukan target minimal rawat jalan.","2 g/kgBB/hari terlalu rendah dan jauh dari target minimal.","20 g/kgBB/hari tidak realistis dan bukan target yang dianjurkan."],e:"Target minimal kenaikan berat badan rawat jalan adalah 5 g/kgBB/hari atau 50 g/kgBB/minggu. Evaluasi dilakukan setiap kunjungan ulang seminggu sekali. Jika target tidak tercapai, perlu dinilai ulang kemungkinan infeksi atau komplikasi."},
{t:"C1-C2",s:"Pada kunjungan pertama rawat jalan, balita gizi buruk tanpa gejala infeksi mendapat amoksisilin 15 mg/kg per oral setiap 8 jam selama...",o:["5 hari","3 hari","7 hari","10 hari","14 hari"],w:["3 hari terlalu pendek dan tidak sesuai dengan regimen yang tercantum.","7 hari adalah durasi gentamisin pada rawat inap, bukan durasi amoksisilin rawat jalan.","10 hari terlalu panjang dan tidak tercantum dalam pedoman.","14 hari tidak sesuai dengan regimen amoksisilin rawat jalan."],e:"Antibiotik spektrum luas diberikan pada kunjungan pertama rawat jalan walaupun tanpa gejala klinis infeksi, karena infeksi pada gizi buruk sering tersembunyi. Amoksisilin 15 mg/kg per oral setiap 8 jam selama 5 hari adalah regimen yang tercantum dalam pedoman."},
{t:"C1-C2",s:"Balita gizi buruk dengan GDS kurang dari 54 mg/dL dan masih sadar, pertolongan awal yang tepat adalah...",o:["Larutan glukosa 10% sebanyak 50 ml secara oral atau melalui NGT","Glukosa 5% 10 ml/kgBB intravena","Susu formula 20 ml","Gula pasir kering diletakkan di lidah","Diazepam intravena"],w:["Glukosa 5% dengan dosis 10 ml/kgBB tidak sesuai regimen; regimen intravena adalah glukosa 10% 5 ml/kgBB.","Susu formula tidak cepat menaikkan glukosa dan bukan terapi hipoglikemia yang dianjurkan.","Gula kering tidak dianjurkan dan berisiko tersedak.","Diazepam tidak diindikasikan untuk hipoglikemia pada gizi buruk."],e:"Hipoglikemia adalah kegawatdaruratan yang mengancam jiwa pada gizi buruk. Pada anak yang sadar diberikan 50 ml glukosa 10% (1 sendok teh gula pasir dalam 50 ml air) secara oral atau melalui NGT. Jika tidak sadar atau letargi, diberikan glukosa 10% intravena bolus 5 ml/kgBB."},
{t:"C1-C2",s:"Pada fase stabilisasi rawat inap, F-75 diberikan setiap ... dalam 24 jam pertama.",o:["2 jam","1 jam","4 jam","6 jam","8 jam"],w:["1 jam terlalu sering dan melebihi jadwal pemberian yang dianjurkan.","4 jam terlalu jarang untuk fase awal sehingga kebutuhan energi tidak terpenuhi.","6 jam terlalu jarang untuk fase stabilisasi.","8 jam jauh terlalu jarang dan meningkatkan risiko hipoglikemia."],e:"Pada 24 jam pertama fase stabilisasi, F-75 diberikan setiap 2 jam, lalu dilanjutkan setiap 2-3 jam siang dan malam selama minimal dua hari. Pemberian sering ini penting untuk mencegah hipoglikemia dan memenuhi kebutuhan awal."},
{t:"C1-C2",s:"ReSoMal pada dehidrasi gizi buruk fase stabilisasi diberikan 5 ml/kgBB setiap 30 menit selama...",o:["2 jam pertama","30 menit pertama saja","4 jam pertama","10 jam","24 jam"],w:["Pemberian 30 menit saja tidak cukup; jadwal berlangsung dua jam.","4 jam pertama melampaui jadwal intensif yang dianjurkan.","10 jam adalah durasi ReSoMal selang-seling dengan F-75 setelah dua jam pertama, bukan fase intensif awal.","24 jam terlalu lama dan tidak sesuai dengan pedoman."],e:"Setelah 2 jam pertama, ReSoMal 5 ml/kgBB diberikan setiap 30 menit. Selanjutnya ReSoMal 5-10 ml/kgBB/jam diberikan berselang-seling dengan F-75 selama 10 jam. ReSoMal juga diberikan setiap kali diare, yaitu 50-100 ml untuk usia di bawah 2 tahun atau 100-200 ml untuk usia 2 tahun atau lebih."},
{t:"C1-C2",s:"Balita gizi buruk dikategorikan hipotermia bila suhu tubuhnya di bawah...",o:["36 °C","35 °C","37 °C","38 °C","34 °C"],w:["35 °C adalah ambang yang lebih rendah sehingga terlambat mendeteksi hipotermia gizi buruk.","37 °C masih dalam rentang normal dan tidak termasuk hipotermia.","38 °C adalah demam, bukan hipotermia.","34 °C adalah hipotermia yang lebih berat, tetapi ambang diagnosisnya tetap 36 °C."],e:"Hipotermia pada gizi buruk didefinisikan sebagai suhu di bawah 36 °C. Penatalaksanaannya berupa penghangatan dengan menutup seluruh tubuh termasuk kepala, atau metode kanguru (skin-to-skin) dengan dada ibu, dan hipotermia termasuk prioritas kegawatdaruratan pada fase stabilisasi."},
{t:"C1-C2",s:"Kriteria sembuh balita gizi buruk, yang dipenuhi selama 2 minggu berturut-turut, adalah...",o:["LiLA minimal 12,5 cm dan/atau Z-score BB/PB atau BB/TB minimal -2 SD, tanpa edema, dan klinis baik","LiLA minimal 11,5 cm saja","Z-score minimal -3 SD dengan edema ringan","Kenaikan berat badan 2 kg dalam satu minggu","Nafsu makan baik tanpa perubahan antropometri"],w:["LiLA 11,5 cm masih termasuk kriteria gizi buruk, bukan kriteria sembuh.","Z-score -3 SD masih termasuk gizi buruk, dan edema juga tidak boleh ada.","Kenaikan berat badan sesaat belum menunjukkan pemulihan status gizi.","Nafsu makan baik tidak cukup; kriteria antropometri dan klinis harus terpenuhi."],e:"Balita dinyatakan sembuh bila selama 2 minggu berturut-turut LiLA minimal 12,5 cm (hijau) dan/atau Z-score BB/PB atau BB/TB minimal -2 SD, tanpa edema, dan klinis baik. Kriteria ini menilai pemulihan status gizi secara menyeluruh."},
{t:"C1-C2",s:"Remaja perempuan dengan obesitas mengalami menstruasi jarang (kurang dari 9 siklus per tahun), hirsutisme, dan akantosis nigrikans. Komorbiditas yang paling mungkin adalah...",o:["Sindrom polikistik ovarium","Sindrom Cushing primer","Hipotiroidisme","Sindrom hipoventilasi obesitas","Pubertas prekoks"],w:["Sindrom Cushing primer memberi moon facies, buffalo hump, dan striae, tidak khas menyebabkan menstruasi jarang.","Hipotiroid memberi kelelahan, penurunan prestasi, dan goiter, bukan hirsutisme dan akantosis nigrikans.","Sindrom hipoventilasi obesitas ditandai sianosis dan gagal jantung kanan, bukan gangguan menstruasi.","Pubertas prekoks adalah perkembangan seks sekunder dini, tidak sesuai dengan menstruasi jarang pada remaja."],e:"Sindrom polikistik ovarium pada obesitas ditandai menstruasi jarang (kurang dari 9 siklus per tahun), hirsutisme, dan akantosis nigrikans, yang berkaitan dengan resistensi insulin. Ini tercantum sebagai komorbiditas obesitas dalam Rekomendasi IDAI 2014."},
{t:"C3-C4",s:"Balita laki-laki 14 bulan, BB 6 kg, edema bilateral pitting derajat +2, LiLA 10,5 cm, muntah terus-menerus, dan tampak letargi. Tatalaksana awal yang paling tepat adalah...",o:["Rawat inap fase stabilisasi, dengan F-75 setiap 2 jam, ReSoMal untuk dehidrasi, pemeriksaan GDS, dan antibiotik","Rawat jalan dengan F-100 setiap 4 jam dan amoksisilin","Rawat jalan dengan RUTF saja tanpa pemeriksaan","Infus NaCl hipertonik lalu pulang","Pemberian susu biasa 200 ml setiap 6 jam"],w:["Rawat jalan tidak tepat karena terdapat komplikasi berupa dehidrasi berat (muntah terus-menerus) dan letargi.","RUTF saja tidak cukup; pasien perlu stabilisasi, pemeriksaan gula darah, dan penilaian komplikasi.","Infus hipertonik berisiko memperberat keadaan dan tidak diindikasikan; pemulangan tidak aman.","Susu biasa tidak sesuai untuk gizi buruk dan berisiko beban osmotik serta hipoglikemia."],e:"Balita ini memiliki komplikasi berupa muntah terus-menerus (dehidrasi berat) dan letargi, sehingga harus dirawat inap. Fase stabilisasi meliputi pemeriksaan hipoglikemia, F-75 setiap 2 jam, ReSoMal untuk dehidrasi, dan antibiotik karena semua balita gizi buruk dianggap menderita infeksi saat datang."},
{t:"C3-C4",s:"Pada hari kedua fase stabilisasi, balita gizi buruk tiba-tiba sesak dengan edema paru dan takikardia setelah asupan energi dan protein ditingkatkan cepat. Mekanisme yang paling mungkin adalah...",o:["Refeeding syndrome: Na+ berpindah dari intraselular ke plasma sehingga beban jantung meningkat","Hipoglikemia berat akibat F-75","Dehidrasi akibat ReSoMal","Infeksi saluran napas bawah tanpa hubungan dengan asupan","Reaksi alergi terhadap susu formula"],w:["Hipoglikemia menimbulkan kejang atau letargi, bukan edema paru akibat beban natrium dan cairan.","Dehidrasi menyebabkan hipovolemia, bukan edema paru dan sesak.","Infeksi dapat terjadi, tetapi pola pemicu yang berhubungan dengan peningkatan asupan cepat mengarah ke refeeding syndrome.","Alergi formula memberi urtikaria, bronkospasme, atau angioedema, bukan pola ini."],e:"Refeeding syndrome terjadi bila energi dan protein terlalu tinggi pada fase stabilisasi. Na+ bergeser dari intraselular ke plasma sehingga beban jantung meningkat dan dapat terjadi gagal jantung. Karena itu energi dan protein harus dinaikkan bertahap dan dipantau."},
{t:"C3-C4",s:"Protein yang diberikan terlalu tinggi pada fase stabilisasi dapat menimbulkan rangkaian berikut...",o:["NH3 meningkat, beban hati dan ginjal naik, pengeluaran urin berlebihan, lalu dehidrasi","Hipoglikemia, lalu hipotermia, lalu anemia","Hiperkalemia, lalu aritmia, lalu kejang","Hipokalsemia, lalu tetani, lalu kejang","Hiperbilirubinemia, lalu ikterus, lalu kernikterus"],w:["Hipoglikemia dan hipotermia tidak berhubungan langsung dengan kelebihan protein dalam pedoman ini.","Hiperkalemia tidak termasuk rangkaian yang dijelaskan untuk kelebihan protein dalam pedoman.","Hipokalsemia tidak termasuk rangkaian yang dijelaskan untuk kelebihan protein.","Hiperbilirubinemia tidak dihubungkan dengan kelebihan protein dalam pedoman ini."],e:"Kelebihan protein pada fase stabilisasi menghasilkan NH3 yang harus dikeluarkan, sehingga beban hati dan ginjal meningkat. Akibatnya urin keluar dalam jumlah besar dan terjadi dehidrasi. Karena itu protein dibatasi 1-1,5 g/kgBB/hari pada fase stabilisasi dan dinaikkan bertahap."},
{t:"C3-C4",s:"Balita gizi buruk di rawat inap dapat dipindahkan ke fase transisi bila...",o:["Komplikasi medis teratasi, tidak ada hipoglikemia, nafsu makan pulih, dan edema berkurang","Berat badan telah mencapai 4 kg","Anak sudah dapat berjalan sendiri","Telah dua hari mendapat F-75 tanpa perubahan","Telah menyelesaikan imunisasi dasar"],w:["Berat 4 kg bukan syarat transisi; balita dengan BB di bawah 4 kg justru dirawat inap sejak awal.","Kemampuan berjalan tidak termasuk kriteria transisi dalam pedoman.","Dua hari F-75 tanpa perubahan menunjukkan belum stabil, bukan syarat transisi.","Imunisasi bukan kriteria transisi dalam fase perawatan gizi buruk."],e:"Fase transisi dimulai setelah komplikasi medis teratasi, tidak ada hipoglikemia, nafsu makan pulih, dan edema berkurang. Pada fase ini F-75 diganti RUTF atau F-100 dengan volume yang sama selama 2 hari, lalu F-100 dinaikkan 10 ml setiap pemberian."},
{t:"C3-C4",s:"Pada fase rehabilitasi rawat inap, target kenaikan berat badan yang diharapkan adalah...",o:["Lebih dari 10 g/kgBB/hari atau minimal 50 g/kgBB/minggu","Minimal 1 g/kgBB/hari","Minimal 2 g/kgBB/minggu","Tidak ada target, yang penting asupan terpenuhi","Minimal 100 g/kgBB/hari"],w:["1 g/kgBB/hari terlalu rendah dan tidak mencapai target fase rehabilitasi.","2 g/kgBB/minggu jauh di bawah target minimal.","Tanpa target, kemajuan tidak dapat dinilai; pedoman mewajibkan pencatatan kenaikan berat badan.","100 g/kgBB/hari tidak realistis dan tidak sesuai pedoman."],e:"Pada fase rehabilitasi, berat badan ditimbang setiap pagi sebelum makan dan kenaikannya dihitung setiap 3 hari dalam g/kgBB/hari. Target kenaikan lebih dari 10 g/kgBB/hari atau minimal 50 g/kgBB/minggu, dengan energi 150-220 kkal dan protein 4-6 g/kgBB/hari."},
{t:"C3-C4",s:"Balita 12 bulan dengan gizi buruk, BB 3,8 kg, tanpa komplikasi medis. Tempat perawatan yang tepat adalah...",o:["Rawat inap, karena balita 6-59 bulan dengan BB di bawah 4 kg","Rawat jalan dengan F-100 setiap 4 jam","Rawat jalan dengan RUTF saja","Pulang dengan multivitamin saja","Observasi di rumah dengan ASI saja"],w:["Rawat jalan tidak tepat pada BB di bawah 4 kg, karena alur tatalaksana mengharuskan rawat inap.","RUTF saja tidak memenuhi tatalaksana karena pasien perlu pengawasan rawat inap.","Multivitamin saja tidak cukup dan tidak sesuai alur tatalaksana.","ASI saja tidak mencukupi kebutuhan gizi buruk dengan BB di bawah 4 kg."],e:"Alur tatalaksana menetapkan balita 6-59 bulan dengan BB kurang dari 4 kg untuk dirawat inap, meskipun tanpa komplikasi. Perawatan kemudian mengikuti tiga fase: stabilisasi, transisi, dan rehabilitasi."},
{t:"C3-C4",s:"Balita gizi buruk dengan komplikasi infeksi dirawat inap. Regimen antibiotik yang tepat sesuai pedoman adalah...",o:["Ampisilin 50 mg/kg IM/IV setiap 6 jam selama 2 hari, dilanjutkan amoksisilin oral 25-40 mg/kg setiap 8 jam selama 5 hari, ditambah gentamisin 7,5 mg/kg sehari sekali selama 7 hari","Amoksisilin 15 mg/kg per oral selama 5 hari saja","Seftriakson 50 mg/kg sekali tanpa tindak lanjut","Metronidazol 7,5 mg/kg setiap 8 jam selama 7 hari","Vankomisin 15 mg/kg setiap 12 jam selama 10 hari"],w:["Amoksisilin oral saja adalah regimen rawat jalan dan tidak cukup untuk komplikasi infeksi di rawat inap.","Seftriakson tunggal tanpa tindak lanjut tidak sesuai alur pedoman rawat inap.","Metronidazol tidak termasuk regimen infeksi gizi buruk dalam pedoman ini.","Vankomisin tidak diindikasikan sebagai lini pertama dalam pedoman tatalaksana gizi buruk."],e:"Semua balita gizi buruk dianggap menderita infeksi saat datang ke fasilitas kesehatan. Balita dengan komplikasi mendapat ampisilin IM/IV selama 2 hari, dilanjutkan amoksisilin oral selama 5 hari, ditambah gentamisin 7,5 mg/kg sehari sekali selama 7 hari. Antihelmintik baru diberikan setelah fase rehabilitasi."},
{t:"C3-C4",s:"Anak laki-laki 6 tahun, BB 30 kg, TB 120 cm, height age 7 tahun, dan BB ideal 22 kg sesuai TB. Dengan rumus kebutuhan kalori (BB ideal × RDA menurut height age, RDA 70 kkal/kg), kebutuhan kalori harian adalah...",o:["1540 kkal/hari","2100 kkal/hari","1100 kkal/hari","1800 kkal/hari","660 kkal/hari"],w:["2100 kkal/hari dihitung dari BB aktual 30 kg, bukan BB ideal.","1100 kkal/hari menggunakan RDA yang terlalu rendah dan tidak sesuai rumus.","1800 kkal/hari tidak sesuai hitungan BB ideal dan RDA height age.","660 kkal/hari terlalu rendah dan dapat menghambat pertumbuhan."],e:"Rumus PPT: kebutuhan kalori = BB ideal × RDA menurut height age. Dengan BB ideal 22 kg dan RDA 70 kkal/kg, kebutuhan = 22 × 70 = 1540 kkal/hari. Menggunakan BB aktual akan memberi kalori berlebih dan memperburuk obesitas."},
{t:"C3-C4",s:"Pada anak yang sama (BB 30 kg, TB 120 cm), indeks massa tubuh (IMT) dan interpretasinya adalah...",o:["IMT 20,83 kg/m² dengan IMT/U di atas P95, sesuai obesitas","IMT 25,5 kg/m² dengan IMT/U P85","IMT 17,0 kg/m² dengan status gizi normal","IMT 30 kg/m² dengan IMT/U P50","IMT 12,5 kg/m² dengan gizi kurang"],w:["IMT 25,5 tidak sesuai perhitungan 30 / (1,20)², sehingga salah secara matematis.","IMT 17,0 tidak sesuai perhitungan dan berada dalam rentang normal.","IMT 30 dan P50 bukan hasil perhitungan dan tidak sesuai kurva.","IMT 12,5 tidak sesuai perhitungan dan menggambarkan kondisi kurus."],e:"IMT = 30 / (1,20)² = 30 / 1,44 = 20,83 kg/m². Nilai ini di atas persentil 95 pada kurva CDC 2000, sehingga anak tergolong obesitas. Penilaian ini dilengkapi BB/TB 136% dan pemeriksaan klinis."},
{t:"C3-C4",s:"Anak laki-laki 8 tahun dengan obesitas disertai TB pendek (TB/U di bawah P3), fungsi mental terlambat, dan usia tulang terlambat. Jenis obesitas ini dan pemeriksaan lanjutan yang tepat adalah...",o:["Obesitas endogen; evaluasi fungsi tiroid dan hormon pertumbuhan","Obesitas idiopatik; cukup diet dan olahraga","Obesitas idiopatik; cukup observasi tanpa pemeriksaan","Obesitas endogen; cukup ubah pola makan tanpa pemeriksaan","Obesitas idiopatik; langsung farmakoterapi orlistat"],w:["Obesitas idiopatik umumnya memiliki TB tinggi, mental normal, dan usia tulang normal, sehingga tidak sesuai dengan gambaran ini.","Pendekatan tanpa pemeriksaan tidak tepat untuk obesitas endogen yang memiliki penyebab endokrin atau genetik.","Gambaran TB pendek dan mental terlambat termasuk obesitas endogen, sehingga observasi saja tidak cukup.","Farmakoterapi bukan tatalaksana awal dan tidak mengatasi penyebab endogen."],e:"Menurut tabel PPT, obesitas idiopatik (lebih dari 90% kasus) umumnya memiliki TB tinggi, fungsi mental normal, dan usia tulang normal. Obesitas endogen (kurang dari 10%) memiliki TB pendek, fungsi mental sering terhambat, dan usia tulang terlambat. Pada kasus ini perlu evaluasi penyebab endogen, misalnya hipotiroid atau kelainan endokrin dan genetik lain."},
{t:"C3-C4",s:"Anak perempuan 10 tahun dengan obesitas, moon facies, buffalo hump, striae violaceae, hirsutisme, hipertensi, dan riwayat penggunaan steroid jangka panjang. Pemeriksaan penunjang yang paling tepat untuk menilai sindrom Cushing adalah...",o:["Kortisol bebas urin 24 jam dan/atau uji supresi deksametason","TSH dan FT4","Hormon pertumbuhan (GH) puasa","Estradiol serum","Alfa-fetoprotein serum"],w:["TSH dan FT4 menilai fungsi tiroid, bukan hiperkortisolisme.","GH puasa menilai gangguan hormon pertumbuhan, tidak menegakkan hiperkortisolisme.","Estradiol menilai fungsi gonad, tidak khas untuk sindrom Cushing.","AFP adalah penanda tumor, tidak relevan untuk diagnosis sindrom Cushing."],e:"Gambaran moon facies, buffalo hump, striae, dan hipertensi mengarah ke hiperkortisolisme. Riwayat steroid jangka panjang merupakan penyebab eksogen yang harus disingkirkan, sedangkan sindrom Cushing primer merupakan komorbiditas obesitas dalam tabel PPT. Langkah awal adalah pemeriksaan kortisol bebas urin 24 jam dan uji supresi deksametason."},
{t:"C3-C4",s:"Remaja perempuan 12 tahun dengan obesitas mengeluh nyeri kepala hebat, fotofobia, dan penglihatan ganda akibat gangguan saraf VI. Pemeriksaan fundus menunjukkan gambaran diskus optikus kabur. Diagnosis yang paling mungkin adalah...",o:["Pseudotumor serebri (hipertensi intrakranial idiopatik)","Migren tanpa aura","Glaukoma sudut tertutup","Meningitis bakterial","Tumor otak primer"],w:["Migren tidak menyebabkan diskus optikus kabur atau paresis saraf VI.","Glaukoma memberi nyeri mata, pandangan kabur, dan halo, bukan diskus kabur akibat tekanan intrakranial tinggi.","Meningitis disertai demam dan kaku kuduk, tidak sesuai pola ini.","Tumor otak biasanya memberi defisit fokal; pola ini lebih mengarah ke pseudotumor serebri."],e:"Pada obesitas, pseudotumor serebri ditandai nyeri kepala hebat, fotofobia, penglihatan ganda akibat paresis saraf VI, dan gambaran diskus optikus kabur. Ini tercantum sebagai komorbiditas obesitas dalam tabel PPT. Diagnosis dipastikan dengan pungsi lumbal untuk mengukur tekanan dan pencitraan untuk menyingkirkan lesi lain."},
{t:"C3-C4",s:"Anak laki-laki 9 tahun dengan obesitas, mengorok keras, henti napas saat tidur, sering terbangun, dan mengantuk di siang hari. Tonsil membesar. Diagnosis yang paling mungkin adalah...",o:["Obstructive sleep apnea (OSA)","Asma nokturnal","Narkolepsi primer","Sindrom Cushing","Hipotiroidisme"],w:["Asma nokturnal memberi batuk dan mengi, tidak ditandai henti napas saat tidur dengan tonsil membesar.","Narkolepsi ditandai serangan tidur mendadak di siang hari tanpa mengorok dan henti napas.","Sindrom Cushing memberi gambaran wajah dan kulit khas, bukan mengorok dan henti napas.","Hipotiroid memberi kelelahan dan benjolan leher, tidak khas dengan henti napas saat tidur."],e:"OSA pada obesitas ditandai mengorok, henti napas saat tidur, sering terbangun, dan mengantuk di siang hari, sering disertai pembesaran tonsil. Ini tercantum sebagai komorbiditas dalam tabel PPT. Pemeriksaan standar adalah polisomnografi, dan tatalaksana meliputi penurunan berat badan serta tonsilektomi bila diindikasikan."},
{t:"C3-C4",s:"Remaja dengan obesitas dan DM tipe 2 tidak respons terhadap terapi konvensional (diet, aktivitas fisik, modifikasi perilaku). Farmakoterapi yang dipertimbangkan untuk mengatasi komorbiditas adalah...",o:["Metformin","Sibutramin","Orlistat","Bedah bariatrik","Vitamin D dosis tinggi"],w:["Sibutramin bekerja menekan nafsu makan dan dalam PPT ditempatkan untuk penurunan berat badan, bukan untuk mengatasi DM.","Orlistat menghambat absorpsi zat gizi (lemak), tidak mengatasi hiperglikemia secara langsung.","Bedah bariatrik dipertimbangkan pada kondisi berat dan bukan terapi pertama untuk komorbiditas DM.","Vitamin D dosis tinggi tidak termasuk farmakoterapi komorbiditas yang dianjurkan dalam pedoman."],e:"Obat dipertimbangkan pada anak dan remaja obes dengan penyakit penyerta yang tidak respons terhadap terapi konvensional (pencegahan tersier). Metformin dipakai untuk mengatasi komorbiditas seperti DM tipe 2. Orlistat dan sibutramin untuk penurunan berat badan, dan bedah bariatrik untuk kasus berat."},
{t:"C3-C4",s:"Pada pencegahan sekunder obesitas anak dikenal adiposity rebound, yaitu titik terendah kurva IMT setelah tahun pertama kehidupan. Adiposity rebound yang terjadi lebih dini (kurang dari 5 tahun) berhubungan dengan...",o:["Peningkatan risiko obesitas dan sindrom metabolik di kemudian hari","Penurunan risiko obesitas pada remaja","Peningkatan risiko gizi buruk pada balita","Peningkatan kadar hemoglobin","Perbaikan pertumbuhan tinggi badan"],w:["Penurunan risiko obesitas bertentangan dengan temuan adiposity rebound dini.","Gizi buruk berhubungan dengan kekurangan energi, bukan dengan adiposity rebound dini.","Hemoglobin tidak terkait langsung dengan fenomena ini.","Adiposity rebound dini tidak dikaitkan dengan perbaikan tinggi badan; fokusnya pada risiko metabolik."],e:"Adiposity rebound adalah titik terendah kurva IMT setelah tahun pertama kehidupan, kemudian IMT kembali naik. Bila terjadi lebih dini (kurang dari 5 tahun), risiko obesitas dan sindrom metabolik di masa depan meningkat. Karena itu deteksi dini termasuk pencegahan sekunder."}
];
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const L="ABCDE";
let order=[],i=0,score=0,lv={};
function start(){
  order=sh(Q).map(q=>({q,o:sh(q.o.map((t,k)=>({t,c:k===0,r:k===0?"":q.w[k-1]})))}));
  i=0;score=0;lv={"C1-C2":[0,0],"C3-C4":[0,0]};show();
}
function show(){
  const app=document.getElementById('app');app.innerHTML='';
  if(i>=order.length){
    const c=$('div','card');
    c.append($('h3',null,'Hasil: '+score+' / '+order.length+' benar'));
    for(const k in lv)c.append($('p',null,k+': '+lv[k][0]+' / '+lv[k][1]+' benar'));
    const b=$('button','btn','Acak & Mulai Ulang');b.onclick=start;c.append(b);
    app.append(c);return;
  }
  const it=order[i];
  const pb=$('div','bar');const d=$('div');d.style.width=(i/order.length*100)+'%';pb.append(d);app.append(pb);
  const card=$('div','card');
  card.append($('p','tag','Soal '+(i+1)+' / '+order.length+'  ·  '+it.q.t));
  card.append($('p','stem',it.q.s));
  const btns=it.o.map((o,k)=>{
    const b=$('button','opt',L[k]+'. '+o.t);
    b.onclick=()=>pick(b,o,k);card.append(b);return b;
  });
  function pick(b,o,k){
    if(btns[0].disabled)return;
    btns.forEach(x=>x.disabled=true);
    lv[it.q.t][1]++;
    if(o.c){score++;lv[it.q.t][0]++;b.classList.add('ok');}
    else{b.classList.add('bad');btns[it.o.findIndex(x=>x.c)].classList.add('ok');}
    const ex=$('div','exp');
    const ci=it.o.findIndex(x=>x.c);
    ex.append($('p',null,'Jawaban benar: '+L[ci]+'. '+it.o[ci].t));
    ex.append($('p',null,it.q.e));
    ex.append($('h4',null,'Mengapa opsi lain tidak tepat:'));
    const ul=$('ul');
    it.o.forEach((x,j)=>{if(!x.c)ul.append($('li',null,L[j]+'. '+x.t+' → '+x.r));});
    ex.append(ul);
    card.append(ex);
    const nb=$('button','btn',i+1<order.length?'Soal Berikutnya':'Lihat Hasil');
    nb.onclick=()=>{i++;show();};card.append(nb);
  }
  app.append(card);
}
start();
</script>
